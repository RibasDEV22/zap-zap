<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ZapZap - Painel Administrativo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b141a; color: #e9edef; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1, h2 { color: #00a884; }
        .card { background: #111b21; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #222d34; }
        input, textarea, button { background: #2a3942; color: #fff; border: 1px solid #3b4a54; padding: 10px; border-radius: 4px; font-size: 14px; }
        button { background: #00a884; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #008f6f; }
        button.danger { background: #ea0038; }
        button.danger:hover { background: #c2002e; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #222d34; }
        th { background: #202c33; color: #8696a0; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .badge-active { background: #00a884; color: #fff; }
        .badge-inactive { background: #8696a0; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Painel Administrativo - ZapZap</h1>

        <!-- MODO MANUTENÇÃO -->
        <div class="card">
            <h2>Modo de Manutenção</h2>
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                <label>
                    <input type="checkbox" id="maintActive"> Ativar Manutenção
                </label>
            </div>
            <input type="text" id="maintMsg" placeholder="Mensagem de aviso para os usuários..." style="width: 70%;">
            <button onclick="saveMaintenance()">Salvar Estado</button>
        </div>

        <!-- QUADRO DE RECADOS -->
        <div class="card">
            <h2>Gerenciar Recados Globais</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="newAnnouncement" placeholder="Escreva um recado importante..." style="flex: 1;">
                <button onclick="sendAnnouncement()">Publicar Recado</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Mensagem</th>
                        <th>Autor</th>
                        <th>Data</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="announcementsTable">
                    <!-- Preenchido via WebSocket/JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const ws = new WebSocket(`ws://${location.host}`);

        ws.onopen = () => {
            // Requisita estado inicial de manutenção e recados
            ws.send(JSON.stringify({ type: 'get_maintenance' }));
            ws.send(JSON.stringify({ type: 'get_announcements' }));
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'maintenance_status') {
                document.getElementById('maintActive').checked = data.maintenance.active;
                document.getElementById('maintMsg').value = data.maintenance.message || '';
            }

            if (data.type === 'announcements_list') {
                renderAnnouncements(data.announcements);
            }

            if (['new_announcement', 'announcement_deactivated', 'announcement_deleted'].includes(data.type)) {
                ws.send(JSON.stringify({ type: 'get_announcements' }));
            }
        };

        function saveMaintenance() {
            const active = document.getElementById('maintActive').checked;
            const message = document.getElementById('maintMsg').value;
            ws.send(JSON.stringify({ type: 'set_maintenance', active, message }));
        }

        function sendAnnouncement() {
            const input = document.getElementById('newAnnouncement');
            if (!input.value.trim()) return;
            ws.send(JSON.stringify({ type: 'create_announcement', message: input.value.trim() }));
            input.value = '';
        }

        function deactivateAnnouncement(id) {
            ws.send(JSON.stringify({ type: 'deactivate_announcement', id }));
        }

        function deleteAnnouncement(id) {
            ws.send(JSON.stringify({ type: 'delete_announcement', id }));
        }

        function renderAnnouncements(list) {
            const tbody = document.getElementById('announcementsTable');
            tbody.innerHTML = '';
            list.forEach(item => {
                const date = new Date(item.createdAt).toLocaleString('pt-BR');
                const status = item.active ? '<span class="badge badge-active">Ativo</span>' : '<span class="badge badge-inactive">Inativo</span>';
                
                tbody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.message}</td>
                        <td>${item.createdBy}</td>
                        <td>${date}</td>
                        <td>${status}</td>
                        <td>
                            ${item.active ? `<button onclick="deactivateAnnouncement(${item.id})">Desativar</button>` : ''}
                            <button class="danger" onclick="deleteAnnouncement(${item.id})">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
